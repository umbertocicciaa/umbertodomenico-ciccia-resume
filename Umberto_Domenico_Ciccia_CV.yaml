design:
  theme: classic

  page:
    size: a4
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: false

  typography:
    font_size:
      body: 9.5pt
      name: 24pt
      connections: 9.5pt
      section_titles: 1.2em
    line_spacing: 0.58em

  header:
    space_below_name: 0.1cm
    space_below_connections: 0.2cm

  section_titles:
    space_above: 0.3cm
    space_below: 0.18cm

  sections:
    space_between_regular_entries: 0.5em
    space_between_text_based_entries: 0.18em
    show_time_spans_in: []

  entries:
    date_and_location_width: 0cm
    highlights:
      space_above: 0cm
      space_between_items: 0em
    summary:
      space_above: 0cm

  templates:
    experience_entry:
      main_column: |-
        **COMPANY**, LOCATION, DATE
        **POSITION**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: ""

    normal_entry:
      main_column: |-
        **NAME**
        LOCATION, DATE
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: ""

    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA -- GPA
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
