locale:
  language: english
  present: Present

design:
  theme: classic

  page:
    size: a4
    top_margin: 0.45in
    bottom_margin: 0.45in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: false
    show_top_note: false

  typography:
    font_size:
      body: 10.5pt
      name: 20pt
      connections: 10.5pt
      section_titles: 1.2em
    line_spacing: 0.6em
    alignment: left

  colors:
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)

  header:
    space_below_name: 0.15cm
    space_below_connections: 0.25cm
    connections:
      show_icons: false
      display_urls_instead_of_usernames: true
      space_between_connections: 0.4cm

  section_titles:
    space_above: 0.2cm
    space_below: 0.15cm

  sections:
    space_between_regular_entries: 0.3em
    space_between_text_based_entries: 0.15em
    show_time_spans_in: []

  entries:
    date_and_location_width: 0cm
    highlights:
      space_above: 0cm
      space_between_items: 0em
    summary:
      space_above: 0cm

  templates:
    experience_entry:
      main_column: |-
        **COMPANY**, LOCATION #h(1fr) DATE
        **POSITION**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: ""
    normal_entry:
      main_column: |-
        **NAME**, SUMMARY
        HIGHLIGHTS
      date_and_location_column: ""
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA -- GPA #h(1fr) LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: ""